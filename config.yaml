# VulnScan API configuration
# Environment variables are referenced using ${VAR_NAME} or ${VAR_NAME:default} syntax.
# They are resolved at startup by config_loader.py using os.environ.get(), NOT by the
# YAML parser.  This means yaml.safe_load() can be used safely.

app:
  name: VulnScan API
  version: "2.3.1"
  secret_key: "${SECRET_KEY:default-dev-secret-change-me-in-production}"
  debug: false
  testing: false

database:
  driver: postgresql
  host: "${POSTGRES_HOST:localhost}"
  port: "${POSTGRES_PORT:5432}"
  name: "${POSTGRES_DB:vulnscan}"
  user: "${POSTGRES_USER:vulnscan}"
  password: "${POSTGRES_PASSWORD:}"
  pool_size: 10
  max_overflow: 20
  pool_recycle: 3600

redis:
  host: "${REDIS_HOST:localhost}"
  port: 6379
  db: 0
  max_connections: 50

scanning:
  nmap_path: /usr/bin/nmap
  default_timeout: 300
  max_concurrent_scans: 5
  allowed_scan_types:
    - basic
    - full
    - stealth
    - udp
    - vuln
  result_retention_days: 90

ssh:
  key_directory: "${SSH_KEY_DIR:/opt/vulnscan/keys}"
  known_hosts: /opt/vulnscan/known_hosts
  connection_timeout: 30
  command_timeout: 120
  default_user: vulnscan-agent

reports:
  template_dir: "${TEMPLATE_DIR:app/templates}"
  output_dir: "${REPORT_OUTPUT_DIR:/tmp/reports}"
  max_vulns_per_report: 10000
